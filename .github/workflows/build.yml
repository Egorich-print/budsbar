name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer

jobs:
  test:
    name: Build and test (macOS 27.2+)
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Check toolchain
        run: |
          xcodebuild -version
          xcrun --sdk macosx27.2 --show-sdk-version
          swift --version

      - name: Build
        run: swift build -c release

      - name: Test
        run: |
          python3 - <<'PY'
          import platform
          version = tuple(map(int, platform.mac_ver()[0].split('.')[:2]))
          if version < (27, 2):
              raise SystemExit('Tests require a macOS 27.2+ runner; the hosted image is still older.')
          PY
          ./scripts/test.sh

  bundle:
    name: Assemble app bundle
    runs-on: xcode-27
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build the .app
        run: ./scripts/build-app.sh

      - name: Package
        run: |
          cd build
          tar -czf BudsBar-${{ runner.os }}.tar.gz BudsBar.app
          shasum -a 256 BudsBar-${{ runner.os }}.tar.gz > BudsBar-${{ runner.os }}.tar.gz.sha256
          cat BudsBar-${{ runner.os }}.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: BudsBar-app
          path: build/BudsBar-*.tar.gz*

  release:
    name: Publish release
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: xcode-27
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build the .app
        run: ./scripts/build-app.sh

      - name: Package
        run: |
          cd build
          tar -czf BudsBar-${{ runner.os }}.tar.gz BudsBar.app
          shasum -a 256 BudsBar-${{ runner.os }}.tar.gz > BudsBar-${{ runner.os }}.tar.gz.sha256

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            build/BudsBar-${{ runner.os }}.tar.gz
            build/BudsBar-${{ runner.os }}.tar.gz.sha256
